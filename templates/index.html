<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OnePlug Africa</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20viewBox%3D%220%200%20200%20230%22%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%3E%3Crect%20x%3D%2270%22%20y%3D%224%22%20width%3D%2216%22%20height%3D%2236%22%20rx%3D%226%22%20fill%3D%22%23006B3F%22%3E%3C/rect%3E%3Crect%20x%3D%22114%22%20y%3D%224%22%20width%3D%2216%22%20height%3D%2236%22%20rx%3D%226%22%20fill%3D%22%23006B3F%22%3E%3C/rect%3E%3Cpath%20d%3D%22M100%20186%20C100%20206%20118%20212%20140%20212%20L152%20212%22%20fill%3D%22none%22%20stroke%3D%22%2310211A%22%20stroke-width%3D%2214%22%20stroke-linecap%3D%22round%22%3E%3C/path%3E%3Crect%20x%3D%22150%22%20y%3D%22199%22%20width%3D%2238%22%20height%3D%2226%22%20rx%3D%226%22%20fill%3D%22%2310211A%22%3E%3C/rect%3E%3Crect%20x%3D%22186%22%20y%3D%22206%22%20width%3D%228%22%20height%3D%2212%22%20rx%3D%222.5%22%20fill%3D%22%2310211A%22%3E%3C/rect%3E%3Crect%20x%3D%22156%22%20y%3D%22205%22%20width%3D%227%22%20height%3D%2214%22%20rx%3D%221.5%22%20fill%3D%22%23FCD116%22%3E%3C/rect%3E%3Crect%20x%3D%22165.5%22%20y%3D%22205%22%20width%3D%227%22%20height%3D%2214%22%20rx%3D%221.5%22%20fill%3D%22%23FCD116%22%3E%3C/rect%3E%3Crect%20x%3D%22175%22%20y%3D%22205%22%20width%3D%227%22%20height%3D%2214%22%20rx%3D%221.5%22%20fill%3D%22%23FCD116%22%3E%3C/rect%3E%3Ccircle%20cx%3D%22100%22%20cy%3D%22112%22%20r%3D%2278%22%20fill%3D%22%23006B3F%22%3E%3C/circle%3E%3Ccircle%20cx%3D%22100%22%20cy%3D%22112%22%20r%3D%2267.5%22%20fill%3D%22none%22%20stroke%3D%22%23FFFFFF%22%20stroke-width%3D%225%22%20stroke-linecap%3D%22round%22%20stroke-dasharray%3D%22318%20106%22%20transform%3D%22rotate%28-90%20100%20112%29%22%20opacity%3D%220.95%22%3E%3C/circle%3E%3Ccircle%20cx%3D%22100%22%20cy%3D%2244.5%22%20r%3D%224.5%22%20fill%3D%22%23FFFFFF%22%3E%3C/circle%3E%3Ccircle%20cx%3D%22100%22%20cy%3D%22112%22%20r%3D%2257%22%20fill%3D%22%23FCD116%22%3E%3C/circle%3E%3Cpolygon%20points%3D%22108%2C70%2076%2C118%2098%2C118%2090%2C154%20126%2C104%20104%2C104%20116%2C70%22%20fill%3D%22%2310211A%22%20stroke%3D%22%2310211A%22%20stroke-width%3D%222%22%20stroke-linejoin%3D%22round%22%3E%3C/polygon%3E%3C/svg%3E">
<meta name="theme-color" content="#006B3F">
<meta name="description" content="One app. Every charge, every swap. Find, hold and pay for EV charging and battery swaps in any OnePlug country.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
</head>
<body>
<div class="splash" id="splash" role="img" aria-label="OnePlug, charge and swap"><div></div><div class="brand"><span class="mark"><svg viewBox="0 0 200 230" aria-hidden="true"><rect x="70" y="4" width="16" height="36" rx="6" fill="#FFFFFF"></rect><rect x="114" y="4" width="16" height="36" rx="6" fill="#FFFFFF"></rect><path d="M100 186 C100 206 118 212 140 212 L152 212" fill="none" stroke="#FFFFFF" stroke-width="14" stroke-linecap="round"></path><rect x="150" y="199" width="38" height="26" rx="6" fill="#FFFFFF"></rect><rect x="186" y="206" width="8" height="12" rx="2.5" fill="#FFFFFF"></rect><rect x="156" y="205" width="7" height="14" rx="1.5" fill="#006B3F"></rect><rect x="165.5" y="205" width="7" height="14" rx="1.5" fill="#006B3F"></rect><rect x="175" y="205" width="7" height="14" rx="1.5" fill="#006B3F"></rect><circle cx="100" cy="112" r="78" fill="#FFFFFF"></circle><circle cx="100" cy="112" r="67.5" fill="none" stroke="#006B3F" stroke-width="5" stroke-linecap="round" stroke-dasharray="318 106" transform="rotate(-90 100 112)" opacity="0.95"></circle><circle cx="100" cy="44.5" r="4.5" fill="#006B3F"></circle><circle cx="100" cy="112" r="57" fill="#FCD116"></circle><polygon points="108,70 76,118 98,118 90,154 126,104 104,104 116,70" fill="#10211A" stroke="#10211A" stroke-width="2" stroke-linejoin="round"></polygon></svg></span><div class="wm">OnePlug</div><div class="tag">Charge · Swap</div></div><div class="foot"><span>One app. Every charge, every swap.</span><span class="splash-mkt" id="splashMkt"></span></div></div>
<div class="app">
  <!-- EXPLORE -->
  <section class="view active" id="v-explore" aria-label="Find chargers">
    <div class="mapzone">
      <div id="map" role="application" aria-label="Map of charging stations"></div>
      <div class="float-top">
        <div class="brandpill"><span class="mark"><svg viewBox="0 0 200 230" aria-hidden="true"><rect x="70" y="4" width="16" height="36" rx="6" fill="#006B3F"></rect><rect x="114" y="4" width="16" height="36" rx="6" fill="#006B3F"></rect><path d="M100 186 C100 206 118 212 140 212 L152 212" fill="none" class="lks" stroke="#10211A" stroke-width="14" stroke-linecap="round"></path><rect x="150" y="199" width="38" height="26" rx="6" class="lk" fill="#10211A"></rect><rect x="186" y="206" width="8" height="12" rx="2.5" class="lk" fill="#10211A"></rect><rect x="156" y="205" width="7" height="14" rx="1.5" fill="#FCD116"></rect><rect x="165.5" y="205" width="7" height="14" rx="1.5" fill="#FCD116"></rect><rect x="175" y="205" width="7" height="14" rx="1.5" fill="#FCD116"></rect><circle cx="100" cy="112" r="78" fill="#006B3F"></circle><circle cx="100" cy="112" r="67.5" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-dasharray="318 106" transform="rotate(-90 100 112)" opacity="0.95"></circle><circle cx="100" cy="44.5" r="4.5" fill="#FFFFFF"></circle><circle cx="100" cy="112" r="57" fill="#FCD116"></circle><polygon points="108,70 76,118 98,118 90,154 126,104 104,104 116,70" fill="#10211A" stroke="#10211A" stroke-width="2" stroke-linejoin="round"></polygon></svg></span><span class="wm">OnePlug</span><button class="mkt" id="mktPill" aria-label="Change country"></button></div>
        <label class="searchbar">
          <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="m20 20-4-4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          <input id="q" type="search" placeholder="Search chargers & swap stations" aria-label="Search stations">
        </label>
        <div class="kindseg" id="kindseg" role="group" aria-label="Station type"></div>
        <div class="chips" id="filters" role="group" aria-label="Filters"></div>
      </div>
      <div class="map-fabs">
        <button class="fab" id="fitBtn" aria-label="Show all of Ghana">GH</button>
        <div class="zoomgrp"><button class="fab" id="zin" aria-label="Zoom in">+</button><button class="fab" id="zout" aria-label="Zoom out">−</button></div>
        <button class="fab" id="meBtn" aria-label="Go to my location"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M21 3 3 10.5l7.5 3 3 7.5z"/></svg></button>
      </div>

    </div>
    <div class="drawer">
      <div class="handle"></div>
      <div class="drawer-head"><h2 id="countLabel">Nearby</h2><span class="muted" id="netLabel"></span></div>
      <div id="hero"></div>
      <div class="legend" id="legend" aria-label="Map key"></div>
      <div id="list"></div>
    </div>
  </section>

  <section class="view" id="v-charge" aria-label="Charging"></section>
  <section class="view" id="v-wallet" aria-label="Wallet"></section>
  <section class="view" id="v-account" aria-label="Account"></section>
</div>

<div class="page" id="page" role="dialog" aria-modal="true"><div class="page-inner" id="pageBody"></div></div>
<div class="dock" id="dock"><div class="dock-inner" id="dockBody"></div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<nav class="tabs" aria-label="Main">
  <div class="inner">
    <button data-tab="explore" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2z"/><path d="M9 4v14M15 6v14"/></svg>Map</button>
    <button data-tab="charge"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M13 2 4 14h7l-1 8 9-12h-7l1-8z"/></svg><span>Charging<i class="live-dot" id="liveDot"></i></span></button>
    <button data-tab="wallet"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><rect x="3" y="6" width="18" height="13" rx="3"/><path d="M3 10h18"/></svg>Wallet</button>
    <button data-tab="account"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>Account</button>
  </div>
</nav>

<script>window.ONEPLUG = {{ boot|tojson }};</script>
<script src="https://cdn.jsdelivr.net/npm/@googlemaps/markerclusterer@2/dist/index.min.js"></script>
<script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
