# Render Blueprint: New > Blueprint > pick this repo.
# Free plans: the web service sleeps after 15 min idle; the free Postgres
# database expires 30 days after creation unless upgraded (render.com/docs/free).
services:
  - type: web
    runtime: python
    name: oneplug-africa
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 2 --timeout 60
    healthCheckPath: /healthz
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: oneplug-db
          property: connectionString
      - key: GOOGLE_MAPS_API_KEY
        sync: false
      - key: GOOGLE_MAP_ID
        sync: false

databases:
  - name: oneplug-db
    plan: free
    databaseName: oneplug
    user: oneplug
